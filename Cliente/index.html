<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa de campo</title>
</head>
<body>
    <br>
    <center>
    <header><h1>Pesquisa de Campo</h1></header>
    <h3>Um pesquisador da Faculdade de Jaguariúa precisa de um Banco de Usos de Inteligência Artificial, para ajudar, responda a as perguntas a seguir:</h3>
    <br>
    <main>
        <form action="http://localhost:3000/" method="post">
            <input type="text" name="sistema" placeholder="Qual o sistema?" required>
            <br><br>
            <input type="text" name="tipo" placeholder="Tipo" required>
            <br><br>
            <input type="text" name="finalidade" placeholder="Finalidade" required>
            <br><br>
            <input type="text" name="tecnologia" placeholder="Tecnologia" required>
            <br><br>
            <input type="text" name="nivel_risco" placeholder="Nível de Risco" required>
            <br><br>
            <input type="text" name="revisao" placeholder="Possui revisão humana?" required>
            <br><br>
            <input type="reset" value="Limpar Pesquisa"/>
            <input type="submit" />
        </form>
    </main>
    <footer><h4>by Miguel Pignata</h4></footer>
    </center>
</body>
</html>
